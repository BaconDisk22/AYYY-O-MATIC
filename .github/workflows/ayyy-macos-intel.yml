name: Intel Mac Preview Build
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: screenshot-refresh-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    timeout-minutes: 45
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt PySide6 pyinstaller pyserial
      - name: Verify Python source
        run: python -m compileall -q desktop/ayyy_o_matic.py mesh_bot.py modules
      - name: Test Qt dashboard\n        env:\n          QT_QPA_PLATFORM: offscreen\n        run: python -m unittest discover -s desktop/tests -v\n      - name: Capture demonstration screenshot
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir -p screenshots
          python desktop/ayyy_o_matic.py --demo-screenshot screenshots/ayyy-o-matic-dashboard.png
          test -s screenshots/ayyy-o-matic-dashboard.png
          file screenshots/ayyy-o-matic-dashboard.png | grep PNG
      - name: Package Intel Mac dashboard
        run: |
          pyinstaller --noconfirm --clean --windowed --name AYYY-O-MATIC \
            --target-arch x86_64 \
            --collect-submodules modules \
            --collect-submodules meshtastic \
            --collect-submodules pubsub \
            --add-data 'mesh_bot.py:.' \
            --add-data 'config.template:.' \
            --add-data 'modules:modules' \
            --add-data 'etc:etc' \
            --add-data 'script:script' \
            desktop/ayyy_o_matic.py
          test -d dist/AYYY-O-MATIC.app
          test -x dist/AYYY-O-MATIC.app/Contents/MacOS/AYYY-O-MATIC
          file dist/AYYY-O-MATIC.app/Contents/MacOS/AYYY-O-MATIC | grep x86_64
          ditto -c -k --sequesterRsrc --keepParent dist/AYYY-O-MATIC.app AYYY-O-MATIC-Intel.zip
          mkdir -p dmg-stage
          cp -R dist/AYYY-O-MATIC.app dmg-stage/
          ln -s /Applications dmg-stage/Applications
          hdiutil create -volname AYYY-O-MATIC -srcfolder dmg-stage -ov -format UDZO AYYY-O-MATIC-Intel.dmg
          shasum -a 256 AYYY-O-MATIC-Intel.zip AYYY-O-MATIC-Intel.dmg > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AYYY-O-MATIC-Intel-preview
          path: |
            AYYY-O-MATIC-Intel.zip
            AYYY-O-MATIC-Intel.dmg
            SHA256SUMS.txt
            screenshots/*.png
      - name: Publish successful builds to GitHub Releases
        if: success() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
            gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --prerelease --generate-notes --target "$GITHUB_SHA"
          else
            if ! gh release view "v0.1.0" >/dev/null 2>&1; then
              RELEASE_TAG="v0.1.0"
              gh release create "$RELEASE_TAG" --prerelease --target "$GITHUB_SHA" --title "AYYY-O-MATIC v0.1.0 — Intel Mac Preview" --notes "First Intel Mac preview release. Includes an unsigned DMG installer, ZIP app bundle, SHA256 checksums, and demonstration dashboard screenshot. On macOS, Control-click the app and select Open if Gatekeeper blocks it."
            else
              RELEASE_TAG="preview"
              gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --prerelease --target "$GITHUB_SHA" --title "AYYY-O-MATIC Intel Mac Preview" --notes "Automatically updated unsigned development build from main."
            fi
          fi
          gh release upload "$RELEASE_TAG" AYYY-O-MATIC-Intel.zip AYYY-O-MATIC-Intel.dmg SHA256SUMS.txt screenshots/*.png --clobber

      - name: Open screenshot pull request
        if: success() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SCREENSHOT_PATHS: |
            screenshots/ayyy-o-matic-dashboard.png
          CHECK_WORKFLOWS: |
            pr-checks.yml
        run: bash .github/scripts/open-screenshot-pr.sh

