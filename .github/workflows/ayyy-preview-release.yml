name: AYYY-O-MATIC Preview Release
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  verify-and-package-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Python syntax
        run: python3 -m compileall -q desktop/ayyy_o_matic.py mesh_bot.py modules
      - name: Build source preview ZIP
        shell: bash
        run: |
          mkdir -p dist
          git archive --format=zip --output=dist/AYYY-O-MATIC-Source.zip HEAD
          sha256sum dist/*.zip > dist/SHA256SUMS.txt
      - name: Upload source package
        uses: actions/upload-artifact@v4
        with:
          name: AYYY-O-MATIC-source-preview
          path: dist/*
      - name: Publish prerelease for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* --prerelease --generate-notes --title "AYYY-O-MATIC ${GITHUB_REF_NAME} — Source Preview 🤌"
